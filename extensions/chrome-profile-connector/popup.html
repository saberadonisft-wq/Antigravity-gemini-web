<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Profile Connector</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Gemini Profile Connector</h1><p>Mỗi hồ sơ Chrome ghép với một account trong bridge.</p><p id="status" role="status" aria-live="polite">Đang kiểm tra…</p><label for="pairing">Mã ghép nối từ lệnh account:pair</label><textarea id="pairing" rows="3" spellcheck="false" autocomplete="off"></textarea><button id="pair">Lưu mã ghép nối</button><div class="actions"><button id="connect">Kết nối</button><button id="disconnect">Ngắt kết nối</button></div><p>Đăng nhập Gemini bằng chính hồ sơ này, rồi chọn “Xác minh” trong launcher. Khi kết nối, Chrome có thể hiện thông báo debugger.</p><p>Connector chỉ dùng tab Gemini. Phiên bản này gửi context dạng văn bản.</p></main><script type="module" src="popup.js"></script></body></html>
